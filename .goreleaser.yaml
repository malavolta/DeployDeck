# .goreleaser.yaml — DeployDeck release configuration (goreleaser v2 schema)
#
# ACTIVATION-GATED: this file is validated in CI (`goreleaser check` +
# `goreleaser release --snapshot --clean`) on every PR, but REAL publication
# (pushing to a Homebrew tap / Scoop bucket, or a real `git tag` release) is
# NOT active yet. See docs/ACTIVATION-CHECKLIST.md for the prerequisites:
# real module/repo path, homebrew-tap + scoop-bucket auxiliary repositories,
# a write-scoped token wired as a secret, and the public/private repo
# decision. Until those exist, `brews:`/`scoops:` below are placeholders and
# `.github/workflows/release.yml` (triggered by a real `v*` tag) will fail or
# no-op on the publish step rather than silently succeed.

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: deploydeck
    main: ./cmd/deploydeck
    binary: deploydeck
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # Keep it simple: build every GOOS x GOARCH combination above, including
    # windows/arm64. Nothing in DeployDeck's dependency set (Bubble Tea,
    # Cobra, stdlib) is platform-restricted, so there is no reason to ignore
    # a cell here.
    ldflags:
      - -s -w
        -X github.com/malavolta/DeployDeck/internal/version.Version={{.Version}}
        -X github.com/malavolta/DeployDeck/internal/version.Commit={{.Commit}}
        -X github.com/malavolta/DeployDeck/internal/version.Date={{.Date}}

archives:
  - id: deploydeck
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"

# Homebrew Cask, published to malavolta/homebrew-tap on release. Uses
# homebrew_casks because `brews` (formula generation) was removed in
# goreleaser v2.16. Casks are macOS-only; Linux users install via
# `go install` or the release tarball. Publishing needs the
# HOMEBREW_TAP_TOKEN secret (Contents: write on the tap repo).
homebrew_casks:
  - name: deploydeck
    binaries:
      - deploydeck
    repository:
      owner: "malavolta"
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/malavolta/DeployDeck"
    description: "Go TUI orchestrating Salesforce commit promotion via git cherry-picks"
    # The binary is not signed/notarized, so strip the Gatekeeper quarantine
    # attribute on install or macOS blocks the first run.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/deploydeck"]
          end

# Scoop manifest, published to malavolta/scoop-bucket on release (Windows).
# Needs the SCOOP_TOKEN secret (Contents: write on the bucket repo).
scoops:
  - name: deploydeck
    repository:
      owner: "malavolta"
      name: scoop-bucket
      token: "{{ .Env.SCOOP_TOKEN }}"
    homepage: "https://github.com/malavolta/DeployDeck"
    description: "Go TUI orchestrating Salesforce commit promotion via git cherry-picks"
    license: "Apache-2.0"
